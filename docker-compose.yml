services:
  mysql:
    image: mysql:8.0
    container_name: meokgo-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: meokgo_db
      MYSQL_ROOT_PASSWORD: meokgo
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - meokgo-mysql-data:/var/lib/mysql

volumes:
  meokgo-mysql-data:
