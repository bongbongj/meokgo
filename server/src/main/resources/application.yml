spring:
  application:
    name: meokgo-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 41MB
  jackson:
    property-naming-strategy: SNAKE_CASE
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/meokgo_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:meokgo}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

app:
  retention:
    region-master-visit-days: ${RETENTION_REGION_MASTER_VISIT_DAYS:3}
  storage:
    local-root: ${STORAGE_LOCAL_ROOT:./storage}
    cleanup-delay-ms: ${STORAGE_CLEANUP_DELAY_MS:3600000}
  story:
    font-family: ${STORY_FONT_FAMILY:SansSerif}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
